        '200':
          description: Timetable entries
    post:
      tags: [Academic]
      summary: Create timetable entry
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimetableInput'
      responses:
        '201':
          description: Timetable entry created

  /api/v1/academic/term-registrations:
    get:
      tags: [Academic]
      summary: List term registrations
      parameters:
        - name: student_id
          in: query
          schema:
            type: integer
        - name: term_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of registrations
    post:
      tags: [Academic]
      summary: Register student for term
      description: |
        Emits `academic.term_registered` event which triggers
        automatic invoice generation in the Finance module.
      requestBody:
        required: true
        content:
