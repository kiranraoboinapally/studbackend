        '201':
          description: Section created

  /api/v1/academic/offerings:
    get:
      tags: [Academic]
      summary: List course offerings
      responses:
        '200':
          description: List of offerings
    post:
      tags: [Academic]
      summary: Create course offering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseOfferingInput'
      responses:
        '201':
          description: Offering created

  /api/v1/academic/offerings/{id}:
    get:
      tags: [Academic]
      summary: Get course offering
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Offering details
    put:
      tags: [Academic]
      summary: Update course offering
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseOfferingInput'
      responses:
        '200':
          description: Offering updated

  /api/v1/academic/offerings/{id}/timetable:
    get:
      tags: [Academic]
      summary: Get offering timetable
      parameters:
        - $ref: '#/components/parameters/ID'
