  /api/v1/students/{id}/guardians:
    get:
      tags: [Student]
      summary: List student guardians
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: List of guardians
    post:
      tags: [Student]
      summary: Add guardian
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianInput'
      responses:
        '201':
          description: Guardian added

  /api/v1/students/{id}/grievances:
    get:
      tags: [Student]
      summary: List student grievances
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: List of grievances
    post:
      tags: [Student]
      summary: File a grievance
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrievanceInput'
      responses:
        '201':
          description: Grievance filed

  # ─── ADMISSIONS ──────────────────────────────────────────────────────────────
  /api/v1/admissions/cycles/open:
    get:
      tags: [Admissions]
      summary: List open admission cycles
      security: []
      responses:
        '200':
          description: List of open cycles

  /api/v1/admissions/cycles:
    get:
      tags: [Admissions]
      summary: List admission cycles
      responses:
        '200':
          description: List of cycles
    post:
      tags: [Admissions]
      summary: Create admission cycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdmissionCycleInput'
      responses:
        '201':
          description: Cycle created

  /api/v1/admissions/cycles/{id}:
    get:
      tags: [Admissions]
      summary: Get admission cycle
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Cycle details
    put:
      tags: [Admissions]
      summary: Update admission cycle
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdmissionCycleInput'
      responses:
        '200':
          description: Cycle updated

  /api/v1/admissions/cycles/{id}/close:
    post:
      tags: [Admissions]
      summary: Close admission cycle
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Cycle closed

  /api/v1/admissions/cycles/{id}/stats:
    get:
      tags: [Admissions]
      summary: Get cycle statistics
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Cycle stats

  /api/v1/admissions/applicants:
    get:
      tags: [Admissions]
      summary: List applicants
      parameters:
        - name: cycle_id
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: page_size
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Paginated list of applicants
    post:
      tags: [Admissions]
      summary: Submit application
      description: Creates an applicant and emits `admission.application_submitted` event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicantInput'
      responses:
        '201':
          description: Application submitted

  /api/v1/admissions/applicants/{id}:
    get:
      tags: [Admissions]
      summary: Get applicant
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Applicant details
    put:
      tags: [Admissions]
      summary: Update applicant
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicantInput'
      responses:
        '200':
          description: Applicant updated

  /api/v1/admissions/applicants/{id}/status:
    put:
      tags: [Admissions]
      summary: Update application status
      description: |
        When status is set to APPROVED, emits `admission.application_approved`
        event which triggers automatic student creation in the Student module.
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status_id]
              properties:
                status_id:
                  type: integer
      responses:
        '200':
          description: Status updated

  /api/v1/admissions/applicants/{id}/status-history:
    get:
      tags: [Admissions]
      summary: Get applicant status history
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Status history

  /api/v1/admissions/applicants/{id}/documents:
    get:
      tags: [Admissions]
      summary: List applicant documents
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: List of documents
    post:
      tags: [Admissions]
      summary: Upload document
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      responses:
        '201':
          description: Document uploaded

  /api/v1/admissions/documents/{id}/verify:
    post:
      tags: [Admissions]
      summary: Verify document
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Document verified

  /api/v1/admissions/seat-allocations:
    post:
      tags: [Admissions]
      summary: Allocate seat
      description: Emits `admission.seat_allocated` event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatAllocationInput'
      responses:
        '201':
          description: Seat allocated

  /api/v1/admissions/applicants/{id}/seat-allocation:
    get:
      tags: [Admissions]
      summary: Get applicant seat allocation
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Seat allocation details

  /api/v1/admissions/cycles/{id}/seat-allocations:
    get:
      tags: [Admissions]
      summary: List seat allocations for cycle
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: List of seat allocations

  /api/v1/admissions/waitlist:
    post:
      tags: [Admissions]
      summary: Add applicant to waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistInput'
      responses:
        '201':
          description: Added to waitlist

  /api/v1/admissions/cycles/{id}/waitlist:
    get:
      tags: [Admissions]
      summary: Get cycle waitlist
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Waitlist

  /api/v1/admissions/applicants/{id}/convert-to-student:
    post:
      tags: [Admissions]
      summary: Convert applicant to student
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_id]
              properties:
                student_id:
                  type: integer
      responses:
        '200':
          description: Applicant converted

  # ─── ACADEMIC ───────────────────────────────────────────────────────────────
  /api/v1/academic/terms:
    get:
      tags: [Academic]
      summary: List academic terms
      responses:
        '200':
          description: List of terms
    post:
      tags: [Academic]
      summary: Create academic term
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTermInput'
      responses:
        '201':
