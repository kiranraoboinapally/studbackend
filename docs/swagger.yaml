openapi: 3.0.3
info:
  title: University ERP Backend API
  description: |
    Production-ready University ERP system with 11 modules covering
    Auth, Core, Student, Admissions, Academic, Finance, HR, Exam,
    Library, Hostel, and Transport.

    **Architecture**: Transactional Outbox Pattern, Scoped RBAC,
    Cross-Module Event Workflows, Structured Logging.
  version: 1.0.0
  contact:
    name: University ERP Team
    email: dev@university-erp.edu

servers:
  - url: http://localhost:8080
    description: Local development

securityDefinitions:
  BearerAuth:
    type: apiKey
    in: header
    name: Authorization
    description: "JWT token format: Bearer <token>"

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Authentication and user management
  - name: Core
    description: Universities, campuses, departments, lookups
  - name: Student
    description: Student profiles, guardians, grievances
  - name: Admissions
    description: Admission cycles, applicants, seat allocation
  - name: Academic
    description: Terms, programs, subjects, registrations, attendance
  - name: Finance
    description: Invoices, payments, scholarships, refunds
  - name: HR
    description: Employees, payroll, leaves, recruitment
  - name: Exam
    description: Schedules, results, revaluation, supplementary
  - name: Library
    description: Books, circulations, fines, reservations
  - name: Hostel
    description: Hostels, rooms, allocations, mess bills, maintenance
  - name: Transport
    description: Buses, routes, passes, vehicle maintenance

paths:
  # ─── AUTH ────────────────────────────────────────────────────────────────────
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin1
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user_id:
                    type: integer
                  username:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
        '401':
          description: Invalid credentials

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  example: student1
                email:
                  type: string
                  example: student1@university.edu
                password:
                  type: string
                  minLength: 6
                  example: secret123
                role_name:
                  type: string
                  default: student
                  enum: [admin, registrar, finance, faculty, student]
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  username:
                    type: string
                  email:
                    type: string
        '409':
          description: Username or email already exists

  /api/v1/auth/profile:
    get:
      tags: [Auth]
      summary: Get current user profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  username:
                    type: string
                  email:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
                  is_active:
                    type: boolean

  # ─── CORE ────────────────────────────────────────────────────────────────────
  /api/v1/lookups/genders:
    get:
      tags: [Core]
      summary: List genders
      security: []
      responses:
        '200':
          description: List of genders

  /api/v1/lookups/categories:
    get:
      tags: [Core]
      summary: List categories
      security: []
      responses:
        '200':
          description: List of categories

  /api/v1/lookups/blood-groups:
    get:
      tags: [Core]
      summary: List blood groups
      security: []
      responses:
        '200':
          description: List of blood groups

  /api/v1/lookups/status-codes:
    get:
      tags: [Core]
      summary: List status codes
      security: []
      parameters:
        - name: module
          in: query
          schema:
            type: string
          description: Filter by module name
      responses:
        '200':
          description: List of status codes

  /api/v1/universities:
    get:
      tags: [Core]
      summary: List universities
      responses:
        '200':
          description: List of universities
    post:
      tags: [Core]
      summary: Create university
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniversityInput'
      responses:
        '201':
          description: University created

  /api/v1/universities/{id}:
    get:
      tags: [Core]
      summary: Get university
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: University details
        '404':
          description: Not found
    put:
      tags: [Core]
      summary: Update university
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniversityInput'
      responses:
        '200':
          description: University updated

  /api/v1/campuses:
    get:
      tags: [Core]
      summary: List campuses
      parameters:
        - name: university_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of campuses
    post:
      tags: [Core]
      summary: Create campus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampusInput'
      responses:
        '201':
          description: Campus created

  /api/v1/campuses/{id}:
    get:
      tags: [Core]
      summary: Get campus
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Campus details
    put:
      tags: [Core]
      summary: Update campus
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampusInput'
      responses:
        '200':
          description: Campus updated

  /api/v1/departments:
    get:
      tags: [Core]
      summary: List departments
      parameters:
        - name: campus_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of departments
    post:
      tags: [Core]
      summary: Create department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentInput'
      responses:
        '201':
          description: Department created

  /api/v1/departments/{id}:
    get:
      tags: [Core]
      summary: Get department
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Department details
    put:
      tags: [Core]
      summary: Update department
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentInput'
      responses:
        '200':
          description: Department updated

  /api/v1/rooms:
    get:
      tags: [Core]
      summary: List rooms
      parameters:
        - name: campus_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of rooms
    post:
      tags: [Core]
      summary: Create room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '201':
          description: Room created

  # ─── STUDENT ─────────────────────────────────────────────────────────────────
  /api/v1/students:
    get:
      tags: [Student]
      summary: List students
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of students

  /api/v1/students/enroll:
    post:
      tags: [Student]
      summary: Enroll a new student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
      responses:
        '201':
          description: Student enrolled

  /api/v1/students/me:
    get:
      tags: [Student]
      summary: Get current student profile
      responses:
        '200':
          description: Student profile

  /api/v1/students/me/dashboard:
    get:
      tags: [Student]
      summary: Get student dashboard
      responses:
        '200':
          description: Dashboard data

  /api/v1/students/{id}:
    get:
      tags: [Student]
      summary: Get student by ID
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Student details
        '404':
