# ─── COMPONENTS ───────────────────────────────────────────────────────────────
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    UniversityInput:
      type: object
      required: [name, short_name]
      properties:
        name:
          type: string
        short_name:
          type: string
        established_year:
          type: integer
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        phone:
          type: string
        email:
          type: string
        website:
          type: string
        is_active:
          type: boolean
          default: true

    CampusInput:
      type: object
      required: [university_id, name, code]
      properties:
        university_id:
          type: integer
        name:
          type: string
        code:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        phone:
          type: string
        is_main_campus:
          type: boolean
        is_active:
          type: boolean
          default: true

    DepartmentInput:
      type: object
      required: [name, code]
      properties:
        campus_id:
          type: integer
        name:
          type: string
        code:
          type: string
        parent_department_id:
          type: integer
        established_year:
          type: integer
        hod_employee_id:
          type: integer
        description:
          type: string
        is_active:
          type: boolean
          default: true

    RoomInput:
      type: object
      required: [campus_id, room_number, room_type, capacity]
      properties:
        campus_id:
          type: integer
        room_number:
          type: string
        room_type:
          type: string
        capacity:
          type: integer
        building:
          type: string
        floor:
