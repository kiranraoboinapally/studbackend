  /api/v1/academic/terms/current:
    get:
      tags: [Academic]
      summary: Get current academic term
      responses:
        '200':
          description: Current term

  /api/v1/academic/terms/{id}:
    get:
      tags: [Academic]
      summary: Get academic term
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Term details
    put:
      tags: [Academic]
      summary: Update academic term
      parameters:
