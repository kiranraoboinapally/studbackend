  /api/v1/academic/programs/{id}/subjects/{subject_id}:
    delete:
      tags: [Academic]
      summary: Remove subject from program
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: subject_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Subject removed

  /api/v1/academic/subjects:
    get:
      tags: [Academic]
      summary: List subjects
      responses:
        '200':
          description: List of subjects
    post:
      tags: [Academic]
      summary: Create subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectInput'
      responses:
        '201':
          description: Subject created

  /api/v1/academic/subjects/{id}:
    get:
      tags: [Academic]
      summary: Get subject
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Subject details
    put:
      tags: [Academic]
      summary: Update subject
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectInput'
      responses:
        '200':
          description: Subject updated

  /api/v1/academic/batches:
    get:
      tags: [Academic]
      summary: List batches
      responses:
        '200':
          description: List of batches
    post:
      tags: [Academic]
      summary: Create batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchInput'
      responses:
        '201':
          description: Batch created

  /api/v1/academic/batches/{id}/sections:
    get:
      tags: [Academic]
      summary: List sections in batch
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: List of sections
    post:
      tags: [Academic]
      summary: Create section
      parameters:
